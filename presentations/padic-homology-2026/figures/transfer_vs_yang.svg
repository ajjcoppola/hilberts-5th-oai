<text x="140" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1a1a1a">n+2</text>
<line x1="140" y1="100" x2="370" y2="100" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="100" x2="140" y2="210" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
