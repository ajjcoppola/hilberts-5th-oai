<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
<rect width="100%" height="100%" fill="#faf8f5"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker></defs>
<text x="24" y="36" font-family="Georgia,serif" font-size="18" fill="#8b3a2a">Transfer over Q vs Yang p-torsion</text>
<rect x="40" y="70" width="200" height="60" rx="4" fill="#fff" stroke="#8b3a2a" stroke-width="1.5"/>
<text x="140" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1a1a1a">p-adic</text>
<text x="140" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1a1a1a">transfer</text>
<rect x="270" y="70" width="200" height="60" rx="4" fill="#fff" stroke="#8b3a2a" stroke-width="1.5"/>
<text x="370" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1a1a1a">No Q</text>
<text x="370" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1a1a1a">jump</text>
